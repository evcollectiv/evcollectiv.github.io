<style>
/* Layout: Apple-Calendar-style app shell — sticky header with nav + view switcher, one scrolling view area below. */
:root{

}

  --accent:#ff453a; --accent-fg:#ffffff; --weekend:#0b0b0c; --shadow:0 10px 40px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{

/* Header */
header{flex:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 8px;border-bottom:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;gap:10px}

.rcard .ic svg{width:17px;height:17px}
.rcard .n{justify-self:end;font-family:var(--font-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.rcard .l{grid-column:1/-1;font-weight:600;color:var(--muted);font-size:14px}
.rcard[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--c)}
.rh{font-family:var(--font-display);font-size:30px;font-weight:800;letter-spacing:-.02em;margin:22px 0 4px}
.radd{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.radd input{flex:1;border:0;background:transparent;outline:none;font-size:16px;min-width:0}
.radd .cb.ghost{--c:var(--muted);width:22px;height:22px;border-width:2px;border-style:dashed;opacity:.6}
.rgh{margin:20px 0 2px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.rgh.late{color:var(--accent)}
.rgh.cal{color:var(--c);text-transform:none;letter-spacing:0;font-size:18px;font-weight:700}
.rrow{--c:#888;display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-soft);cursor:pointer}
.rrow .cb{width:22px;height:22px;margin-top:1px;border-width:2px}
.rrow .cb.on::after{width:9px;height:5px;border-width:0 0 2px 2px}
.rbody{flex:1;min-width:0}
.rt{font-size:16px;overflow-wrap:anywhere}
.rn{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm{font-size:13px;color:var(--muted);margin-top:2px}
.rm.late{color:var(--accent)}
.rrow.done .rt{color:var(--muted)}
.rcal{flex:none;font-size:12px;color:var(--c);font-weight:600;margin-top:3px;max-width:32%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rempty{color:var(--muted);text-align:center;padding:40px 0}
.sheet input,.sheet select,.sheet textarea{font-size:16px}
</style>



<div class="app">
  <header>
    <div class="toprow">
      <div class="navbtns">
        <button class="icon-btn" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button class="icon-btn" id="next" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <h1 id="title"></h1>
      <button class="text-btn" id="todayBtn">Today</button>
      <button class="icon-btn" id="calsBtn" aria-label="Calendars"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg></button>
    </div>
    <div class="subrow">
      <div class="seg" role="group" aria-label="View">
        <button data-view="day">Day</button><button data-view="week">Week</button><button data-view="month">Month</button><button data-view="year">Year</button>
      </div>
      <span id="status"></span>
    </div>
  </header>
  <main id="main"><div class="view" id="view"></div></main>
  <nav class="tabbar" aria-label="Sections">
    <button data-tab="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg><span>Calendar</span></button>
    <button data-tab="rem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="5" cy="6.5" r="1.6"/><circle cx="5" cy="12" r="1.6"/><circle cx="5" cy="17.5" r="1.6"/><path d="M10 6.5h10M10 12h10M10 17.5h10"/></svg><span>Reminders</span></button>
  </nav>
</div>
<button class="fab" id="addBtn" aria-label="New event or task"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="sheetHost"></div>
<div id="toast" hidden></div>

<script>
(()=>{
const COLORS={red:'#ff3b30',orange:'#ff9500',yellow:'#ffcc00',green:'#34c759',teal:'#30b0c7',blue:'#007aff',indigo:'#5856d6',purple:'#af52de',pink:'#ff2d55',brown:'#a2845e'};
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOW1=['S','M','T','W','T','F','S'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const REPEATS=[['none','Never'],['daily','Every day'],['weekdays','Every weekday (Mon–Fri)'],['weekly','Every week'],['biweekly','Every 2 weeks'],['monthly','Every month'],['yearly','Every year']];

const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mins=t=>{if(!t)return 0;const[h,m]=t.split(':').map(Number);return h*60+(m||0)};
const toT=m=>`${pad(Math.floor(m/60)%24)}:${pad(m%60)}`;
const fmtTime=t=>{let[h,m]=t.split(':').map(Number);const ap=h<12?'AM':'PM';h=h%12||12;return m?`${h}:${pad(m)} ${ap}`:`${h} ${ap}`};
const sow=d=>addDays(d,-d.getDay());
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

// ---------- state ----------
const state={cals:new Map(),items:new Map()};
let view=LS.get('pl.view','month'); if(!['day','week','month','year'].includes(view))view='month';
let cursor=new Date(); cursor.setHours(0,0,0,0);
let hidden=new Set(LS.get('pl.hidden',[]));
let tab=LS.get('pl.tab','cal');if(tab!=='cal'&&tab!=='rem')tab='cal';
let remFilter=LS.get('pl.rf','today');
let db=null, mode='loading', readOnly=false;

const cache=LS.get('pl.cache',null);
if(cache){(cache.cals||[]).forEach(c=>state.cals.set(c.id,c));(cache.items||[]).forEach(i=>state.items.set(i.id,i));}
function saveCache(){LS.set('pl.cache',{cals:[...state.cals.values()],items:[...state.items.values()]})}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}
function setStatus(){const s=document.getElementById('status');s.textContent=mode==='db'?(readOnly?'View only':'Synced'):mode==='local'?'Saved on this device only':mode==='stale'?'Can’t reach saved data yet':'Loading…'}

// write queue: one write at a time per document
const queues=new Map();
function enqueue(key,fn){const p=(queues.get(key)||Promise.resolve()).then(fn,fn);queues.set(key,p.catch(()=>{}));return p}
function persistErr(e){
  if(e&&e.code==='invalid_argument'){readOnly=true;setStatus();toast('You can view this planner but not change it.')}
  else if(e&&e.code==='quota_exceeded'){toast('Storage is full. Delete some old items to save more.')}
  else toast('Couldn’t save that change. Check your connection and try again.');
}
function put(coll,obj){
  state[coll==='calendars'?'cals':'items'].set(obj.id,obj);saveCache();render();
  if(db&&!readOnly){const ref=db.collection(coll).doc(obj.id);enqueue(coll+obj.id,()=>ref.set(JSON.parse(JSON.stringify(obj)))).catch(persistErr)}
}
function remove(coll,id){
  state[coll==='calendars'?'cals':'items'].delete(id);saveCache();render();
  if(db&&!readOnly){const ref=db.collection(coll).doc(id);enqueue(coll+id,()=>ref.delete()).catch(persistErr)}
}

// ---------- recurrence ----------
function occursOn(it,ds){
  if(!it.date||ds<it.date)return false;
  if(it.until&&ds>it.until)return false;
  if((it.skip||[]).includes(ds))return false;
  const r=it.repeat||'none';
  if(r==='none')return ds===it.date;
  const d=parse(ds),s=parse(it.date),days=(it.days&&it.days.length)?it.days:[s.getDay()];
  switch(r){
    case 'daily':return true;
    case 'weekdays':return d.getDay()>0&&d.getDay()<6;
    case 'weekly':return days.includes(d.getDay());
    case 'biweekly':{const wk=Math.round((sow(d)-sow(s))/6048e5);return wk%2===0&&days.includes(d.getDay())}
    case 'monthly':return d.getDate()===s.getDate();
    case 'yearly':return d.getDate()===s.getDate()&&d.getMonth()===s.getMonth();
  }
  return false;
}
const visibleItems=()=>[...state.items.values()].filter(i=>!hidden.has(i.cal));
const calOf=it=>state.cals.get(it.cal)||{color:'blue',name:'Calendar'};
const colorOf=it=>COLORS[calOf(it).color]||calOf(it).color||'#888';
const isDone=(it,ds)=>(it.done||[]).includes(ds);
const untimed=it=>it.allDay||(it.kind==='task'&&!it.start);

// segments for one day: {it, occ (occurrence date), s, e, cont}
function daySegments(ds){
  const out=[],prev=ymd(addDays(parse(ds),-1));
  for(const it of visibleItems()){
    if(occursOn(it,ds)){
      if(untimed(it))out.push({it,occ:ds,allday:true});
      else{const s=mins(it.start);let e=it.kind==='task'?s+30:mins(it.end);if(it.kind!=='task'&&e<=s)e=1440;out.push({it,occ:ds,s,e:Math.min(e,1440),overnight:it.kind!=='task'&&mins(it.end)<=s})}
    }
    if(!untimed(it)&&it.kind!=='task'&&mins(it.end)<=mins(it.start)&&mins(it.end)>0&&occursOn(it,prev)){
      out.push({it,occ:prev,s:0,e:mins(it.end),cont:true});
    }
  }
  return out;
}
function sortSegs(a){return a.sort((x,y)=>(y.allday?1:0)-(x.allday?1:0)||(x.s??0)-(y.s??0)||String(x.it.title).localeCompare(y.it.title))}

// ---------- rendering ----------
// Every view scrolls natively, so flicks carry momentum like Apple Calendar:
// Month and Year scroll vertically forever; Day and Week scroll sideways with paging.
const V=document.getElementById('view');
const hourPx=()=>parseInt(getComputedStyle(document.documentElement).getPropertyValue('--hour'))||52;
const todayStr=()=>ymd(new Date());
const isPhone=()=>window.innerWidth<600;
const dayDiff=(a,b)=>Math.round((new Date(b.getFullYear(),b.getMonth(),b.getDate())-new Date(a.getFullYear(),a.getMonth(),a.getDate()))/864e5);

function setTitle(){
  const T=document.getElementById('title');const y=cursor.getFullYear(),m=cursor.getMonth();
  const remMode=tab==='rem';
  document.querySelector('.navbtns').hidden=remMode;document.getElementById('todayBtn').hidden=remMode;document.querySelector('.seg').hidden=remMode;
  document.querySelectorAll('.tabbar button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tab===tab));
  if(remMode){T.textContent='Reminders';return}
  if(view==='year')T.innerHTML=`<span class="yr">${y}</span>`;
  else if(view==='month')T.innerHTML=`${MONTHS[m]} <span class="yr">${y}</span>`;
  else if(view==='week'){const a=sow(cursor),b=addDays(a,6),yr=isPhone()?'':`, ${b.getFullYear()}`;T.textContent=a.getMonth()===b.getMonth()?`${MONTHS[a.getMonth()].slice(0,3)} ${a.getDate()}–${b.getDate()}${yr}`:`${MONTHS[a.getMonth()].slice(0,3)} ${a.getDate()} – ${MONTHS[b.getMonth()].slice(0,3)} ${b.getDate()}${yr}`}
  else T.textContent=cursor.toLocaleDateString(undefined,isPhone()?{weekday:'short',month:'short',day:'numeric'}:{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===view));
}
function render(fresh){
  setStatus();
  const vkey=tab==='rem'?'rem':view;
  const keep=!fresh&&V.dataset.v===vkey;
  if(!keep){mRange=null;yRange=null;tRange=null}
  V.classList.toggle('tlmode',tab==='cal'&&(view==='day'||view==='week'));
  if(tab==='rem')renderReminders(keep);else if(view==='month')renderMonth(keep);else if(view==='year')renderYear(keep);else renderTime(view==='day'?1:7,keep);
  V.dataset.v=vkey;setTitle();
}

function cbHTML(it,occ,done,extra=''){return `<span class="cb${done?' on':''}" role="checkbox" aria-checked="${done}" data-toggle="${it.id}" data-occ="${occ}" tabindex="0" aria-label="Mark ${esc(it.title)} done"${extra}></span>`}
function chipHTML(g){
  const it=g.it,c=colorOf(it),done=it.kind==='task'&&isDone(it,g.occ);
  const timed=!g.allday&&it.kind!=='task';
  return `<div class="chip${timed?' timed':''}${done?' done':''}" style="--c:${c}" data-open="${it.id}" data-occ="${g.occ}">${it.kind==='task'?cbHTML(it,g.occ,done):''}<span class="t">${esc(it.title)}</span>${!g.allday&&!g.cont?`<span class="tm">${fmtTime(it.start).replace(' ','')}</span>`:''}</div>`;
}

// ----- Month: one long vertical scroll of months -----
let mRange=null;
function monthSection(y,m){
  const first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),lead=first.getDay(),td=todayStr(),max=isPhone()?3:4,now=new Date();
  const cur=y===now.getFullYear()&&m===now.getMonth();
  const col=lead>=4?`grid-column:1 / ${lead+2};text-align:right`:`grid-column:${lead+1} / 8`;
  let h=`<section class="msec" data-ym="${y}-${m}"><div class="mhead"><h2 class="mname${cur?' cur':''}" style="${col}">${MONTHS[m]}${m===0?` <span class="myr">${y}</span>`:''}</h2></div><div class="mgrid">`;
  for(let i=0;i<lead;i++)h+='<div class="mcell blank"></div>';
  for(let dn=1;dn<=days;dn++){
    const d=new Date(y,m,dn),ds=ymd(d),segs=sortSegs(daySegments(ds).filter(g=>!g.cont));
    h+=`<div class="mcell${ds===td?' today':''}${d.getDay()%6===0?' wknd':''}" data-day="${ds}" role="button" tabindex="0" aria-label="${d.toDateString()}, ${segs.length} items"><span class="dnum">${dn}</span>`;
    segs.slice(0,max).forEach(g=>h+=chipHTML(g));
    if(segs.length>max)h+=`<span class="more">+${segs.length-max} more</span>`;
    h+='</div>';
  }
  return h+'</div></section>';
}
function buildMonths(y,m,n){let h='';for(let i=0;i<n;i++){const d=new Date(y,m+i,1);h+=monthSection(d.getFullYear(),d.getMonth())}return h}
const dowH=()=>{const d=V.querySelector('.dow');return d?d.offsetHeight:0};
function renderMonth(keep){
  const top=V.scrollTop;
  if(!keep||!mRange){const s=new Date(cursor.getFullYear(),cursor.getMonth()-12,1);mRange={y:s.getFullYear(),m:s.getMonth(),n:37};keep=false}
  V.innerHTML=`<div class="dow">${DOW.map(d=>`<span>${isPhone()?d[0]:d}</span>`).join('')}</div><div class="months">${buildMonths(mRange.y,mRange.m,mRange.n)}</div>`;
  if(keep)V.scrollTop=top;
  else{const el=V.querySelector(`[data-ym="${cursor.getFullYear()}-${cursor.getMonth()}"]`);V.scrollTop=el?el.offsetTop-dowH():0}
}
function scrollToMonth(y,m,smooth){
  const el=V.querySelector(`[data-ym="${y}-${m}"]`);
  if(!el){cursor=new Date(y,m,1);mRange=null;render();return}
  V.scrollTo({top:el.offsetTop-dowH(),behavior:smooth&&!reduceMotion()?'smooth':'auto'});
}

// ----- Year: one long vertical scroll of years -----
let yRange=null;
function yearSection(y){
  const td=todayStr(),now=new Date();
  let h=`<section class="ysec" data-y="${y}"><h2 class="yname${y===now.getFullYear()?' cur':''}">${y}</h2><div class="year">`;
  for(let m=0;m<12;m++){
    const first=new Date(y,m,1),days=new Date(y,m+1,0).getDate();
    const cur=y===now.getFullYear()&&m===now.getMonth();
    h+=`<button class="ymonth${cur?'':' past'}" data-month="${m}" data-year="${y}"><h4>${MONTHS[m]}</h4><div class="ygrid">${DOW1.map(d=>`<span class="h">${d}</span>`).join('')}`;
    for(let i=0;i<first.getDay();i++)h+='<span></span>';
    for(let d=1;d<=days;d++){const ds=ymd(new Date(y,m,d));const has=daySegments(ds).length>0;h+=`<span class="${ds===td?'td':''}"><b>${d}</b>${has&&ds!==td?'<i></i>':''}</span>`}
    h+='</div></button>';
  }
  return h+'</div></section>';
}
function renderYear(keep){
  const top=V.scrollTop;
  if(!keep||!yRange){yRange={start:cursor.getFullYear()-3,n:7};keep=false}
  let h='<div class="years">';for(let i=0;i<yRange.n;i++)h+=yearSection(yRange.start+i);
  V.innerHTML=h+'</div>';
  if(keep)V.scrollTop=top;else{const el=V.querySelector(`[data-y="${cursor.getFullYear()}"]`);V.scrollTop=el?el.offsetTop:0}
}
function scrollToYear(y,smooth){
  const el=V.querySelector(`[data-y="${y}"]`);
  if(!el){cursor=new Date(y,0,1);yRange=null;render();return}
  V.scrollTo({top:el.offsetTop,behavior:smooth&&!reduceMotion()?'smooth':'auto'});
}

// Month/Year: update the title as you scroll, and add more months/years before you reach an end
let vTimer=null,vRaf=0;
V.addEventListener('scroll',()=>{
  if(tab!=='cal'||(view!=='month'&&view!=='year'))return;
  if(!vRaf)vRaf=requestAnimationFrame(()=>{vRaf=0;updateFromV()});
  clearTimeout(vTimer);vTimer=setTimeout(extendV,180);
},{passive:true});
function updateFromV(){
  const off=V.scrollTop+(view==='month'?dowH():0)+60;
  const secs=V.querySelectorAll(view==='month'?'.msec':'.ysec');let cur=secs[0];
  for(const s of secs){if(s.offsetTop<=off)cur=s;else break}
  if(!cur)return;
  if(view==='month'){const[y,m]=cur.dataset.ym.split('-').map(Number);if(cursor.getFullYear()!==y||cursor.getMonth()!==m){cursor=new Date(y,m,1);setTitle()}}
  else{const y=+cur.dataset.y;if(cursor.getFullYear()!==y){cursor=new Date(y,cursor.getMonth(),1);setTitle()}}
}
function extendV(){
  const box=V.querySelector(view==='month'?'.months':'.years');if(!box)return;
  const edge=V.clientHeight*2;
  if(V.scrollTop<edge){
    const oldH=V.scrollHeight;
    if(view==='month'){const s=new Date(mRange.y,mRange.m-12,1);box.insertAdjacentHTML('afterbegin',buildMonths(s.getFullYear(),s.getMonth(),12));mRange={y:s.getFullYear(),m:s.getMonth(),n:mRange.n+12}}
    else{let h='';for(let i=3;i>=1;i--)h+=yearSection(yRange.start-i);box.insertAdjacentHTML('afterbegin',h);yRange={start:yRange.start-3,n:yRange.n+3}}
    V.scrollTop+=V.scrollHeight-oldH;
  }
  if(V.scrollTop+V.clientHeight>V.scrollHeight-edge){
    if(view==='month'){const e=new Date(mRange.y,mRange.m+mRange.n,1);box.insertAdjacentHTML('beforeend',buildMonths(e.getFullYear(),e.getMonth(),12));mRange.n+=12}
    else{let h='';for(let i=0;i<3;i++)h+=yearSection(yRange.start+yRange.n+i);box.insertAdjacentHTML('beforeend',h);yRange.n+=3}
  }
}

// ----- Day / Week: a sideways-scrolling strip of day columns that snaps to a day or a week -----
let tRange=null,tTimer=null;
function layoutCols(segs){
  segs.sort((a,b)=>a.s-b.s||b.e-a.e);let cur=[],end=-1;const clusters=[];
  for(const g of segs){if(cur.length&&g.s>=end){clusters.push(cur);cur=[];end=-1}cur.push(g);end=Math.max(end,g.e)}
  if(cur.length)clusters.push(cur);
  for(const c of clusters){const cols=[];for(const g of c){let i=cols.findIndex(e=>e<=g.s);if(i<0){i=cols.length;cols.push(0)}cols[i]=g.e;g.col=i}c.forEach(g=>g.n=cols.length)}
}
function renderTime(per,keep){
  const anchor=per===7?sow(cursor):new Date(cursor.getFullYear(),cursor.getMonth(),cursor.getDate());
  const at=tRange?dayDiff(tRange.start,anchor):-1;
  if(!keep||!tRange||tRange.per!==per||at<per*2||at>tRange.count-per*3){
    tRange={per,start:addDays(anchor,per===7?-7*12:-21),count:per===7?7*25:43};
  }
  const oldTs=V.querySelector('.tl-scroll'),vTop=keep&&oldTs?oldTs.scrollTop:null;
  const H=hourPx(),td=todayStr(),now=new Date(),nowM=now.getHours()*60+now.getMinutes();
  const days=[...Array(tRange.count)].map((_,i)=>addDays(tRange.start,i));
  const segsBy=days.map(d=>daySegments(ymd(d)));
  const maxAll=Math.max(0,...segsBy.map(s=>s.filter(g=>g.allday).length));
  let heads='',cols='';
  days.forEach((d,i)=>{
    const ds=ymd(d),segs=segsBy[i],snap=per===1||d.getDay()===0?' snap':'';
    const all=sortSegs(segs.filter(g=>g.allday));
    heads+=`<div class="tg-day hcell${ds===td?' today':''}" data-day="${ds}" role="button" tabindex="0"><span class="dn">${DOW[d.getDay()]}</span><span class="dd">${d.getDate()}</span>${maxAll?`<div class="ad" style="min-height:${maxAll*20+4}px">${all.map(chipHTML).join('')}</div>`:''}</div>`;
    const timed=segs.filter(g=>!g.allday);layoutCols(timed);
    cols+=`<div class="daycol${snap}${d.getDay()%6===0?' wknd':''}" data-slot="${ds}">`;
    for(const g of timed){
      const it=g.it,c=colorOf(it),top=g.s/60*H,ht=Math.max((g.e-g.s)/60*H-2,18),w=100/g.n,done=it.kind==='task'&&isDone(it,g.occ);
      const tm=it.kind==='task'?fmtTime(it.start):g.cont?`until ${fmtTime(it.end)}`:`${fmtTime(it.start)} – ${fmtTime(it.end)}`;
      cols+=`<div class="ev${it.kind==='task'?' task big':''}${done?' done':''}" style="--c:${c};top:${top}px;height:${ht}px;left:calc(${g.col*w}% + 1px);width:calc(${w}% - 3px)" data-open="${it.id}" data-occ="${g.occ}" role="button" tabindex="0">${it.kind==='task'?cbHTML(it,g.occ,done):''}<div style="min-width:0"><div class="t">${esc(it.title)}</div><div class="tm">${tm}</div></div></div>`;
    }
    if(ds===td)cols+=`<div class="nowline" style="top:${nowM/60*H}px"></div>`;
    cols+='</div>';
  });
  const hours=[...Array(24)].map((_,h)=>`<div>${fmtTime(toT(h*60))}</div>`).join('');
  V.innerHTML=`<div class="tl ${per===7?'week':'day'}">
    <div class="tl-head"><div class="tl-gut"></div><div class="hs"><div class="hrow">${heads}</div></div></div>
    <div class="tl-scroll"><div class="tl-inner"><div class="hours">${hours}</div><div class="bs"><div class="brow">${cols}</div></div></div></div></div>`;
  const bs=V.querySelector('.bs'),hs=V.querySelector('.hs'),ts=V.querySelector('.tl-scroll');
  const cw=bs.clientWidth/per;V.style.setProperty('--cw',cw+'px');
  bs.scrollLeft=dayDiff(tRange.start,anchor)*cw;hs.scrollLeft=bs.scrollLeft;
  if(vTop!=null)ts.scrollTop=vTop;
  else{const showsToday=dayDiff(anchor,now)>=0&&dayDiff(anchor,now)<per;ts.scrollTop=(showsToday?Math.max(0,now.getHours()-1):7)*H}
  let raf=0;
  bs.addEventListener('scroll',()=>{
    hs.scrollLeft=bs.scrollLeft;
    if(!raf)raf=requestAnimationFrame(()=>{raf=0;const i=Math.round(bs.scrollLeft/cw),d=addDays(tRange.start,i);if(ymd(d)!==ymd(cursor)){cursor=d;setTitle()}});
    clearTimeout(tTimer);tTimer=setTimeout(()=>{const i=Math.round(bs.scrollLeft/cw);if(i<per*2||i>tRange.count-per*3)render()},220);
  },{passive:true});
}
function goToDate(date,smooth){
  const per=view==='day'?1:7,target=per===7?sow(date):new Date(date.getFullYear(),date.getMonth(),date.getDate());
  const bs=V.querySelector('.bs'),i=tRange?dayDiff(tRange.start,target):-1;
  cursor=new Date(target);
  if(!bs||i<per*2||i>tRange.count-per*3){render();return}
  setTitle();bs.scrollTo({left:i*(bs.clientWidth/per),behavior:smooth&&!reduceMotion()?'smooth':'auto'});
}

// ----- Reminders: Apple Reminders-style smart lists -----
const REPEAT_LABEL=Object.fromEntries(REPEATS);
const REM_CARDS={
  today:{label:'Today',color:'#007aff',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>'},
  scheduled:{label:'Scheduled',color:'#ff3b30',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>'},
  all:{label:'All',color:'#5b5b62',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13l2.5-7h11L20 13v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M4 13h5l1 2h4l1-2h5"/></svg>'},
  completed:{label:'Completed',color:'#8e8e93',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'}
};
function relDate(ds){
  const td=todayStr();if(ds===td)return 'Today';
  const d=parse(ds),n=dayDiff(new Date(),d);
  if(n===1)return 'Tomorrow';if(n===-1)return 'Yesterday';
  return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',...(d.getFullYear()!==new Date().getFullYear()?{year:'numeric'}:{})});
}
// which occurrence of a reminder the lists show: undated, its one date, or the next one not yet done
function remEntry(it){
  if(!it.date)return{it,occ:'',when:''};
  if(!it.repeat||it.repeat==='none')return{it,occ:it.date,when:it.date};
  const now=new Date();
  for(let i=0;i<=400;i++){const ds=ymd(addDays(now,i));if(occursOn(it,ds)&&!isDone(it,ds))return{it,occ:ds,when:ds}}
  return null;
}
const remSortKey=e=>(e.when||'9999-99-99')+(e.it.start||'99:99');
function remRow(e,showCal=true){
  const it=e.it,done=isDone(it,e.occ),td=todayStr(),now=new Date();
  const late=!done&&e.when&&(e.when<td||(e.when===td&&it.start&&mins(it.start)<now.getHours()*60+now.getMinutes()));
  const meta=[];
  if(e.when)meta.push(relDate(e.when)+(it.start?`, ${fmtTime(it.start)}`:''));
  if(it.repeat&&it.repeat!=='none')meta.push(`↻ ${REPEAT_LABEL[it.repeat]}`);
  const note=(it.notes||'').split('\n')[0];
  return `<div class="rrow${done?' done':''}" style="--c:${colorOf(it)}" data-open="${it.id}" data-occ="${e.occ}" role="button" tabindex="0">${cbHTML(it,e.occ,done)}<div class="rbody"><div class="rt">${esc(it.title)}</div>${note?`<div class="rn">${esc(note)}</div>`:''}${meta.length?`<div class="rm${late?' late':''}">${esc(meta.join(' · '))}</div>`:''}</div>${showCal?`<span class="rcal">${esc(calOf(it).name)}</span>`:''}</div>`;
}
function remDefaultCal(){
  const vis=sortedCals().filter(c=>!hidden.has(c.id));
  if(state.cals.has('personal')&&!hidden.has('personal'))return 'personal';
  return (vis[0]||sortedCals()[0]||{}).id;
}
function renderReminders(keep){
  const top=V.scrollTop,refocus=document.activeElement&&document.activeElement.id==='r-new';
  const td=todayStr();
  const rems=visibleItems().filter(i=>i.kind==='task');
  const open=rems.map(remEntry).filter(e=>e&&!isDone(e.it,e.occ)).sort((a,b)=>remSortKey(a).localeCompare(remSortKey(b)));
  const today=open.filter(e=>e.when&&e.when<=td),sched=open.filter(e=>e.when);
  const completed=[];rems.forEach(it=>(it.done||[]).forEach(ds=>completed.push({it,occ:ds,when:ds})));
  completed.sort((a,b)=>(b.when||'').localeCompare(a.when||''));
  const counts={today:today.length,scheduled:sched.length,all:open.length,completed:completed.length};
  if(!REM_CARDS[remFilter])remFilter='today';
  const cards=Object.entries(REM_CARDS).map(([k,c])=>`<button class="rcard" style="--c:${c.color}" data-filter="${k}" aria-pressed="${k===remFilter}"><span class="ic">${c.icon}</span><span class="n">${counts[k]}</span><span class="l">${c.label}</span></button>`).join('');
  const group=(label,list,cls='',showCal=true,style='')=>list.length?`<h3 class="rgh ${cls}"${style}>${esc(label)}</h3><div class="rlist">${list.map(e=>remRow(e,showCal)).join('')}</div>`:'';
  let body='',empty='';
  if(remFilter==='today'){
    body=group('Overdue',today.filter(e=>e.when<td),'late')+group('Today',today.filter(e=>e.when===td));
    empty='Nothing due today.';
  }else if(remFilter==='scheduled'){
    const by=new Map();sched.forEach(e=>{const k=e.when<td?'Overdue':relDate(e.when);if(!by.has(k))by.set(k,[]);by.get(k).push(e)});
    by.forEach((l,k)=>body+=group(k,l,k==='Overdue'?'late':''));
    empty='No reminders with a date. Add one and turn on Date.';
  }else if(remFilter==='all'){
    sortedCals().filter(c=>!hidden.has(c.id)).forEach(c=>{
      body+=group(c.name,open.filter(e=>e.it.cal===c.id),'cal',false,` style="--c:${COLORS[c.color]||c.color}"`);
    });
    empty='No reminders yet. Type one above to add it.';
  }else{
    body=group('Completed',completed.slice(0,300));
    empty='Reminders you tick off show up here.';
  }
  const card=REM_CARDS[remFilter];
  const ph=remFilter==='today'?'Add a reminder for today':remFilter==='scheduled'?'Add a reminder for today':'Add a reminder';
  V.innerHTML=`<div class="rem"><div class="rcards">${cards}</div>
    <h2 class="rh" style="color:${card.color==='#5b5b62'||card.color==='#8e8e93'?'var(--fg)':card.color}">${card.label}</h2>
    ${remFilter!=='completed'?`<div class="radd"><span class="cb ghost"></span><input id="r-new" type="text" placeholder="${ph}" aria-label="New reminder" enterkeyhint="done" autocomplete="off"></div>`:''}
    ${body||`<p class="rempty">${empty}</p>`}</div>`;
  V.scrollTop=keep?top:0;
  const inp=V.querySelector('#r-new');
  if(inp){
    if(refocus)inp.focus();
    inp.addEventListener('keydown',ev=>{
      if(ev.key!=='Enter'||!inp.value.trim())return;
      ev.preventDefault();ensureCal();
      const date=(remFilter==='today'||remFilter==='scheduled')?td:'';
      put('items',{id:uid(),kind:'task',title:inp.value.trim(),cal:remDefaultCal(),date,start:'',end:'',allDay:false,repeat:'none',days:[],until:'',skip:[],done:[],notes:'',updated:Date.now()});
      const n=V.querySelector('#r-new');if(n){n.value='';n.focus()}
    });
  }
}

// ---------- navigation ----------
const reduceMotion=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}};
function step(dir){
  if(view==='month'){const d=new Date(cursor.getFullYear(),cursor.getMonth()+dir,1);scrollToMonth(d.getFullYear(),d.getMonth(),true)}
  else if(view==='year')scrollToYear(cursor.getFullYear()+dir,true);
  else goToDate(addDays(view==='week'?sow(cursor):cursor,(view==='week'?7:1)*dir),true);
}
function goToday(){
  const t=new Date();t.setHours(0,0,0,0);
  if(view==='month')scrollToMonth(t.getFullYear(),t.getMonth(),true);
  else if(view==='year')scrollToYear(t.getFullYear(),true);
  else goToDate(t,true);
}
function setView(v){view=v;LS.set('pl.view',v);V.dataset.v='';render(true)}
document.getElementById('prev').onclick=()=>step(-1);
document.getElementById('next').onclick=()=>step(1);
document.getElementById('todayBtn').onclick=goToday;
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>setView(b.dataset.view));
document.getElementById('addBtn').onclick=()=>tab==='rem'?openEditor(null,remFilter==='all'?'':todayStr(),undefined,'task'):openEditor(null,ymd(view==='month'||view==='year'?(cursor.getMonth()===new Date().getMonth()&&cursor.getFullYear()===new Date().getFullYear()?new Date():cursor):cursor));
document.getElementById('calsBtn').onclick=openCals;
document.querySelectorAll('.tabbar button').forEach(b=>b.onclick=()=>{if(tab===b.dataset.tab&&tab==='cal'){goToday();return}tab=b.dataset.tab;LS.set('pl.tab',tab);V.dataset.v='';render(true)});
document.addEventListener('keydown',e=>{if(document.getElementById('sheetHost').firstChild)return;if(e.target.matches('input,textarea,select')||tab!=='cal')return;if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1);if(e.key==='t')goToday()});

V.addEventListener('click',e=>{
  const tg=e.target.closest('[data-toggle]');
  if(tg){e.stopPropagation();const it=state.items.get(tg.dataset.toggle);if(!it)return;const occ=tg.dataset.occ,done=new Set(it.done||[]);done.has(occ)?done.delete(occ):done.add(occ);if(tab==='rem'){tg.classList.toggle('on');const row=tg.closest('.rrow');if(row)row.classList.toggle('done');setTimeout(()=>{const cur=state.items.get(it.id);if(cur)put('items',{...cur,done:[...done]})},600)}else put('items',{...it,done:[...done]});return}
  const rf=e.target.closest('[data-filter]');

  if(slot){const r=slot.getBoundingClientRect(),H=hourPx();const m=Math.floor((e.clientY-r.top)/H*2)*30;openEditor(null,slot.dataset.slot,Math.max(0,Math.min(m,1410)))}
});

function ensureCal(){

}

          <button class="small-btn" data-del="${c.id}" aria-label="Delete ${esc(c.name)}">✕</button>
        </div>
        ${openColor===c.id?`<div class="palette">${Object.entries(COLORS).map(([k,v])=>`<button style="--c:${v}" data-pick="${c.id}" data-k="${k}" aria-label="${k}" aria-pressed="${c.color===k}"></button>`).join('')}</div>`:''}
        <div id="dz-${c.id}"></div>`}).join('')}
        <div class="row"><input type="text" id="c-new" placeholder="New calendar name (e.g. Gym)" aria-label="New calendar name"><button class="small-btn" id="c-add">Add</button></div>
      </div>
      <p class="hint">Tap a circle on the left to show or hide that calendar. Tap the color to change it. Rename by editing the name.</p>`;
    S.querySelector('#c-done').onclick=closeSheet;
    S.querySelectorAll('[data-vis]').forEach(b=>b.onclick=()=>{const id=b.dataset.vis;hidden.has(id)?hidden.delete(id):hidden.add(id);LS.set('pl.hidden',[...hidden]);render();draw()});
    S.querySelectorAll('[data-rename]').forEach(inp=>inp.onchange=()=>{const c=state.cals.get(inp.dataset.rename);const v=inp.value.trim();if(c&&v&&v!==c.name)put('calendars',{...c,name:v})});
    S.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{openColor=openColor===b.dataset.color?null:b.dataset.color;draw()});
    S.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{const c=state.cals.get(b.dataset.pick);put('calendars',{...c,color:b.dataset.k});openColor=null;draw()});
    S.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const id=b.dataset.del,c=state.cals.get(id),items=[...state.items.values()].filter(i=>i.cal===id);
      const z=S.querySelector('#dz-'+id);z.innerHTML=`<div class="confirm" style="margin:8px"><p>Delete “${esc(c.name)}”${items.length?` and its ${items.length} item${items.length>1?'s':''}`:''}?</p><button class="red" id="cd-yes">Delete calendar</button><button id="cd-no">Keep it</button></div>`;
      z.querySelector('#cd-no').onclick=()=>z.innerHTML='';
      z.querySelector('#cd-yes').onclick=()=>{items.forEach(i=>remove('items',i.id));remove('calendars',id);draw()}});
    const add=()=>{const v=S.querySelector('#c-new').value.trim();if(!v)return;const used=new Set(cals.map(c=>c.color));const color=Object.keys(COLORS).find(k=>!used.has(k))||'blue';put('calendars',{id:uid(),name:v,color,order:cals.length});draw()};
    S.querySelector('#c-add').onclick=add;S.querySelector('#c-new').onkeydown=e=>{if(e.key==='Enter')add()};
  }
  draw();
}

// keep the now-line fresh
setInterval(()=>{const n=new Date(),m=n.getHours()*60+n.getMinutes();document.querySelectorAll('.nowline').forEach(el=>el.style.top=(m/60*hourPx())+'px')},60000);
let rzT=null;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(!host.firstChild)render()},150)});

// ---------- storage boot ----------
render();
const LOCAL_DEFAULTS=()=>{
  [{id:'spiritual',name:'Spiritual',color:'purple',order:0},{id:'work',name:'Work',color:'blue',order:1},{id:'personal',name:'Personal',color:'green',order:2}].forEach(c=>state.cals.set(c.id,c));
  saveCache();
};
(async()=>{
  let d=null;
  try{d=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){d=null}
  if(!d){mode='local';if(!state.cals.size&&!state.items.size)LOCAL_DEFAULTS();render();return}
  db=d;mode='loading';setStatus();
  let got={calendars:false,items:false};
  const timer=setTimeout(()=>{if(!got.calendars||!got.items){mode='stale';setStatus()}},10000);
  const listen=(coll,key)=>db.collection(coll).onSnapshot(snap=>{
    const m=new Map();snap.docs.forEach(doc=>{if(doc.exists)m.set(doc.id,{...doc.data(),id:doc.id})});
    state[key]=m;
    if(!snap.metadata.fromCache){got[coll]=true;if(got.calendars&&got.items){clearTimeout(timer);mode='db'}}
    saveCache();if(!host.firstChild)render();else setStatus();
  },err=>{clearTimeout(timer);if(err.code==='revoked'||err.code==='not_granted'){mode='local'}else{mode='stale'}setStatus()});
  listen('calendars','cals');listen('items','items');
})();
})();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
